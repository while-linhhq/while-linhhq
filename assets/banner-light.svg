<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420" role="img" aria-label="Huynh Linh — Full-stack &amp; systems">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1500" height="420" fill="url(#bg)"/>
  <circle cx="220" cy="90" r="140" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="1280" cy="320" r="180" fill="#B45309" fill-opacity="0.06" filter="url(#soft)"/>

  <g stroke="#0F172A" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 105 H1500 M0 210 H1500 M0 315 H1500"/>
    <path d="M250 0 V420 M500 0 V420 M750 0 V420 M1000 0 V420 M1250 0 V420"/>
  </g>

  <rect x="0" y="0" width="1500" height="4" fill="url(#accent)"/>
  <rect x="72" y="110" width="6" height="180" rx="3" fill="url(#accent)"/>

  <text x="100" y="155" fill="#64748B" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" letter-spacing="4" font-weight="600">
    FULL-STACK  ·  SYSTEMS  ·  EDGE CV
  </text>
  <text x="100" y="230" fill="#0F172A" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="800">
    Huỳnh Linh
  </text>
  <text x="100" y="285" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="500">
    Offline products · Real-time vision · Reliable backends
  </text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600">
    <rect x="100" y="320" width="150" height="40" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="175" y="346" text-anchor="middle" fill="#0F172A">TypeScript</text>
    <rect x="266" y="320" width="120" height="40" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="326" y="346" text-anchor="middle" fill="#0F172A">Python</text>
    <rect x="402" y="320" width="140" height="40" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="472" y="346" text-anchor="middle" fill="#0F172A">Electron</text>
    <rect x="558" y="320" width="110" height="40" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="613" y="346" text-anchor="middle" fill="#0F172A">CUDA</text>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="2">
    <path d="M1180 80 C1320 120, 1380 200, 1320 300"/>
    <path d="M1220 70 C1380 120, 1420 210, 1340 330"/>
  </g>
</svg>
