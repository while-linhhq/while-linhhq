# Refresh self-hosted light + dark streak SVGs (avoids GitHub camo timeout on demolab).
name: Update streak card

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-streak.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch light + dark streak SVGs
        run: |
          set -euo pipefail
          mkdir -p assets
          light='https://streak-stats.demolab.com/?user=while-linhhq&theme=default&hide_border=true&background=F8FAFC&ring=1D4ED8&fire=B45309&currStreakNum=0F172A&sideNums=334155&sideLabels=64748B&dates=94A3B8&currStreakLabel=0F172A'
          dark='https://streak-stats.demolab.com/?user=while-linhhq&theme=dark&hide_border=true&background=0B1220&ring=60A5FA&fire=E2B659&currStreakNum=E2B659&sideNums=CBD5E1&sideLabels=94A3B8&dates=64748B&currStreakLabel=E2E8F0'

          fetch_one() {
            local url="$1" out="$2"
            local ok=0
            for i in 1 2 3 4 5; do
              if curl -fsSL --max-time 45 "$url" -o "${out}.tmp"; then
                if head -c 200 "${out}.tmp" | grep -q '<svg'; then
                  mv "${out}.tmp" "$out"
                  ok=1
                  break
                fi
              fi
              sleep $((i * 3))
            done
            [[ $ok -eq 1 ]] || { echo "Failed: $out"; exit 1; }
            wc -c "$out"
          }

          fetch_one "$light" assets/streak-light.svg
          fetch_one "$dark" assets/streak-dark.svg
          # keep legacy path as dark alias for old links
          cp assets/streak-dark.svg assets/streak.svg

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/streak-light.svg assets/streak-dark.svg assets/streak.svg
          if git diff --staged --quiet; then
            echo 'No streak change'
            exit 0
          fi
          git commit -m "chore(profile): refresh light/dark streak cards"
          git push
