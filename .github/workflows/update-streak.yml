# Refresh self-hosted streak SVG (static — no fade-in animation).
name: Update streak card

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-streak.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch + staticize streak SVG
        run: |
          set -euo pipefail
          mkdir -p assets
          url='https://streak-stats.demolab.com/?user=while-linhhq&theme=dark&hide_border=true&background=0B1220&ring=60A5FA&fire=E2B659&currStreakNum=E2B659&sideNums=CBD5E1&sideLabels=94A3B8&dates=64748B&currStreakLabel=E2E8F0'
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 45 "$url" -o assets/streak.raw.svg; then
              if head -c 200 assets/streak.raw.svg | grep -q '<svg'; then
                ok=1
                break
              fi
            fi
            sleep $((i * 3))
          done
          [[ $ok -eq 1 ]] || { echo 'Failed to fetch streak SVG'; exit 1; }

          # GitHub often does not run CSS animations → text left at opacity:0 looks "broken/wrong".
          python3 - <<'PY'
          import re
          from pathlib import Path
          svg = Path('assets/streak.raw.svg').read_text(encoding='utf-8', errors='replace')
          svg = re.sub(r'@keyframes\s+\w+\s*\{(?:[^{}]|\{[^{}]*\})*\}', '', svg, flags=re.S)
          svg = re.sub(r'animation\s*:\s*[^;"\']+;?', '', svg, flags=re.I)
          svg = re.sub(r'opacity\s*:\s*0(\.\d+)?\s*;?', 'opacity: 1;', svg, flags=re.I)
          svg = re.sub(r'\s*style=([\'"])\s*\1', '', svg)
          Path('assets/streak.svg').write_text(svg, encoding='utf-8')
          assert '187' in svg or 'Total Contributions' in svg, 'missing expected streak content'
          print('static streak bytes', len(svg))
          PY
          rm -f assets/streak.raw.svg
          wc -c assets/streak.svg

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/streak.svg
          if git diff --staged --quiet; then
            echo 'No streak change'
            exit 0
          fi
          git commit -m "chore(profile): refresh static streak card"
          git push
